<style>
/* Layout: barra de roles arriba; cada rol es una vista de app sobre azul noche, con tarjetas blancas tipo ticket. */
:root {
  --night: #061a36;
  --deep: #0c3466;
  --blue: #1b5590;
  --ice: #a9dcff;
  --frost: #e8f5ff;
  --paper: #ffffff;
  --ink: #0b1a2e;
  --muted: #4a5d75;
  --line: #d9e6f2;
  --ok: #1f7a3d;
  --warn: #b45309;
  --bad: #b42318;
  --void: #4b5563;
  --font-display: "Archivo", "Arial Black", sans-serif;
  --font-body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 600px at 50% -8%, #12457f 0%, rgba(18, 69, 127, 0) 60%),
    var(--night);
  color: var(--frost);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.display { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

/* Barra superior */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: -16px; padding: 12px 16px;
  background: rgba(6, 26, 54, 0.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(169, 220, 255, 0.15);
}
.top-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--paper); }
.brand svg { width: 46px; height: auto; color: var(--ice); }
.brand b { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
.roles { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.role {
  border: 1px solid rgba(169, 220, 255, 0.3); background: transparent; color: var(--frost);
  border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; min-height: 40px;
}
.role[aria-pressed="true"] { background: var(--ice); color: var(--night); border-color: var(--ice); }
.reset { border: 0; background: transparent; color: var(--ice); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; }
.demo-note { max-width: 1120px; margin: 14px auto 0; font-size: 12.5px; color: #bcd6ee; }
.demo-note strong { color: var(--paper); }

main { max-width: 1120px; margin: 22px auto 0; }
.cols { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
.cols-even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) { .cols, .cols-even { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 620px) { .hide-sm { display: none; } .roles { order: 3; flex-basis: 100%; } .roles .role { flex: 1; padding-inline: 8px; } .brand { flex: 1; } }

/* Ticket de venta */
.ticket-head {
  border-radius: 26px 26px 0 0; padding: 28px 22px 24px; text-align: center;
  background: linear-gradient(var(--deep), var(--night)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.logo { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--paper); }
.logo .mtn { width: 92px; color: var(--ice); }
.logo .stack { display: flex; align-items: flex-end; gap: 4px; }
.logo .prod { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 9.5px; font-style: italic; font-weight: 300; letter-spacing: 0.14em; line-height: 1; }
.ticket-head h1 { margin: 0; font-size: 25px; line-height: 1; color: var(--paper); }
.ticket-head .dj { color: var(--ice); font-size: 12px; font-weight: 600; letter-spacing: 0.24em; }
.facts { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: rgba(255, 255, 255, 0.1); border-radius: 16px; overflow: hidden; text-align: left; }
.facts div { background: rgba(6, 26, 54, 0.7); padding: 11px 13px; }
.facts .label { color: var(--ice); font-size: 10px; }
.facts p { margin: 3px 0 0; color: var(--paper); font-size: 13px; font-weight: 600; }
.facts small { color: #c9def2; font-size: 12px; }
.ticket-body { background: var(--paper); color: var(--ink); border-radius: 0 0 26px 26px; padding: 22px 18px 20px; border-top: 2px dashed var(--line); display: flex; flex-direction: column; gap: 20px; box-shadow: 0 30px 70px -24px rgba(0, 0, 0, 0.7); }
.ticket-body .label { color: var(--muted); }
.type { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 16px; padding: 13px; }
.type.on { border-color: var(--blue); background: var(--frost); }
.type .info { flex: 1; min-width: 0; }
.type .name { font-weight: 700; }
.type .desc { font-size: 12.5px; color: var(--muted); }
.type .price { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; color: var(--deep); font-size: 17px; margin-top: 2px; }
.type .left { font-size: 12px; font-weight: 600; color: var(--blue); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 44px; height: 44px; border-radius: 22px; font-size: 20px; line-height: 1; }
.step .minus { border: 1px solid var(--line); background: var(--paper); color: var(--deep); }
.step .plus { border: 0; background: var(--deep); color: var(--paper); }
.step button:disabled { opacity: 0.3; cursor: default; }
.step output { width: 26px; text-align: center; font-weight: 700; font-size: 17px; }
.field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); background: var(--paper); font-size: 14.5px; }
.field:focus { border-color: var(--blue); outline: 3px solid rgba(169, 220, 255, 0.5); outline-offset: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.hint { font-size: 12px; color: var(--muted); }
.err { font-size: 12px; color: var(--bad); font-weight: 600; }
.paybox { background: var(--night); color: var(--paper); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.paybox .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.paybox .total { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 25px; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 800; letter-spacing: 0.06em; min-height: 48px; }
.btn-ice { background: var(--ice); color: var(--night); }
.btn-ice:hover { background: var(--paper); }
.btn-deep { background: var(--deep); color: var(--paper); }
.btn-deep:hover { background: var(--blue); }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: 0; }
.btn-ghost-dark { background: transparent; border: 1px solid rgba(169, 220, 255, 0.4); color: var(--frost); font-weight: 600; letter-spacing: 0; }
.btn-sm { min-height: 40px; padding: 9px 13px; font-size: 13px; letter-spacing: 0; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Paneles */
.panel { background: var(--paper); color: var(--ink); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { margin: 0; font-size: 19px; color: var(--deep); }
.panel .label { color: var(--muted); }
.dark-panel { background: rgba(12, 52, 102, 0.55); border: 1px solid rgba(169, 220, 255, 0.18); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.dark-panel h2 { margin: 0; font-size: 19px; color: var(--paper); }
.dark-panel .label { color: var(--ice); }
.page-title { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.page-title h2 { margin: 0; font-size: clamp(22px, 4vw, 30px); color: var(--paper); }
.page-title .label { color: var(--ice); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--paper); color: var(--ink); border-radius: 16px; padding: 14px 16px; }
.stat .label { color: var(--muted); font-size: 10.5px; }
.stat .v { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 26px; color: var(--deep); margin-top: 4px; }
.stat .v.small { font-size: 21px; }
.list { display: flex; flex-direction: column; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 13px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .grow { flex: 1; min-width: 180px; }
.item .t { font-weight: 700; }
.item .s { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-wait { color: var(--warn); background: #fdf1e3; }
.p-ok { color: var(--ok); background: #e5f4ea; }
.p-bad { color: var(--bad); background: #fbe7e5; }
.p-info { color: var(--blue); background: var(--frost); }
.p-void { color: var(--void); background: #eceef1; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab { border: 1px solid rgba(169, 220, 255, 0.3); background: transparent; color: var(--frost); border-radius: 10px; padding: 9px 13px; font-size: 13.5px; font-weight: 600; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--paper); color: var(--deep); border-color: var(--paper); }
.tab .count { display: inline-block; min-width: 20px; margin-left: 6px; border-radius: 999px; background: var(--warn); color: var(--paper); font-size: 11px; padding: 1px 6px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
th { text-align: left; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 10px; background: var(--frost); }
td { padding: 12px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.money-in { width: 120px; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; letter-spacing: 0.04em; }

/* Puerta */
.scan-result { border-radius: 22px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--paper); }
.scan-result .big { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: clamp(24px, 6vw, 34px); }
.r-ok { background: var(--ok); }
.r-used { background: var(--warn); }
.r-bad { background: var(--bad); }
.r-void { background: var(--void); }
.r-idle { background: rgba(12, 52, 102, 0.55); border: 2px dashed rgba(169, 220, 255, 0.35); color: var(--frost); }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(2, 10, 22, 0.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { width: min(420px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.modal h3 { margin: 0; font-size: 19px; color: var(--deep); }
.mp-head { background: #eef2f6; border-radius: 14px; padding: 12px 14px; font-size: 12.5px; color: #4b5563; font-weight: 600; }
.qr-box { align-self: center; background: var(--paper); padding: 10px; border-radius: 14px; border: 1px solid var(--line); }
.qr-box img, .qr-box canvas { display: block; width: 210px; height: 210px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--deep); font-weight: 700; padding: 12px 18px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise 0.25s ease-out; } @keyframes rise { from { transform: translate(-50%, 10px); opacity: 0; } } }
</style>

  // Una entrada con QR por unidad; si la venta trae personas, cada QR va a nombre de su persona.
  function issueTickets(s, o) {
    if (s.tickets.some((t) => t.orderId === o.id)) return; // nunca dos emisiones
    const ev = s.events.find((e) => e.id === o.eventId);
    const units = [];
    if (o.personas && o.personas.length) o.personas.forEach((p) => units.push({ tipo: p.tipo, titular: p.nombre, email: p.email }));
    else ev.types.forEach((t) => { for (let i = 0; i < (o.items[t.id] || 0); i++) units.push({ tipo: t.id, titular: o.comprador, email: o.email }); });
    units.forEach((u, i) => {
      const tp = ev.types.find((t) => t.id === u.tipo) || { nombre: u.tipo };
      s.tickets.push({ code: o.id + "-" + String(i + 1).padStart(2, "0") + "-" + rand4(), orderId: o.id, tipo: u.tipo, tipoNombre: tp.nombre, titular: u.titular, email: u.email, estado: "valida", usadaEn: null });
    });
  }

  let state;
  function closeModalSafe() { const m = document.getElementById("modal-root"); if (m) m.innerHTML = ""; }
  try { const raw = localStorage.getItem(STORE_KEY); state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
  const valid = (x) => x && x.v === 8 && Array.isArray(x.events) && x.vf && x.draft && x.draft.qty;
  if (!valid(state)) state = valid(window.claude?.hot?.data?.state) ? window.claude.hot.data.state : seed();
  state.role = "comprador"; // al abrir siempre arranca en la página de venta
  closeModalSafe();
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* sin almacenamiento: la demo sigue en memoria */ } };
  window.claude?.hot?.snapshot?.(() => ({ state }));

  let ctxEvent = "ev1"; // evento en uso según la pantalla
  const evById = (id) => state.events.find((e) => e.id === id) || state.events[0];
  const curEv = () => evById(ctxEvent);
  const evOf = (o) => evById(o.eventId);
  const typeById = (id) => curEv().types.find((t) => t.id === id);
  const rrppById = (id) => state.rrpps.find((r) => r.id === id) || { nombre: "—", codigo: "" };
  const orderOf = (t) => state.orders.find((o) => o.id === t.orderId) || {};
  const reserved = (tp) => state.orders.filter((o) => o.eventId === ctxEvent && o.estado !== "rechazado").reduce((a, o) => a + (o.items[tp] || 0), 0);
  const left = (tp) => { const t = typeById(tp); return t ? Math.max(0, t.cupo - reserved(tp)) : 0; };
  const units = (it) => Object.values(it || {}).reduce((a, q) => a + (q || 0), 0);
  const itemsTxt = (it, ev) => ev.types.filter((t) => it[t.id]).map((t) => it[t.id] + " × " + t.nombre.replace(/^Entrada /, "")).join(" · ") || "—";
  const oItems = (o) => itemsTxt(o.items, evOf(o));
  const commissionOf = (o) => o.rrpp && o.estado === "aprobado" ? evOf(o).types.reduce((a, t) => a + (o.items[t.id] || 0) * t.com, 0) : 0;
  const sumTypes = (it, key) => curEv().types.reduce((a, t) => a + (it[t.id] || 0) * t[key], 0);

  function statusPill(o) {
    if (o.estado === "aprobado") return o.metodo === "efectivo" && o.origen === "rrpp" ? '<span class="pill p-ok">Efectivo · QR generados</span>' : '<span class="pill p-ok">Aprobado · QR enviados</span>';
    if (o.estado === "rechazado") return '<span class="pill p-bad">Rechazado</span>';
    return o.origen === "rrpp" ? '<span class="pill p-wait">Por aprobar</span>' : '<span class="pill p-wait">Pagado · por aprobar</span>';
  }

    if (o.metodo === "mercadopago") return "Mercado Pago a Nevada";
    if (o.metodo === "transferencia_nevada") return "Transferencia a Nevada · no rinde";
    return (o.metodo === "efectivo" ? "Efectivo" : "Transferencia al RRPP") + " · rinde " + fmt(o.total);
  }

  /* ───────── RRPP ───────── */
  function rrppStats(id) {
    const os = state.orders.filter((o) => o.rrpp === id);
    const ok = os.filter((o) => o.estado === "aprobado");
    const entradas = ok.reduce((a, o) => a + units(o.items), 0);
    const vendido = ok.reduce((a, o) => a + o.total, 0);
    const gen = ok.reduce((a, o) => a + commissionOf(o), 0);
    const pag = state.payouts.filter((p) => p.rrpp === id).reduce((a, p) => a + p.monto, 0);
    const mine = ok.filter((o) => o.origen === "rrpp");
    const cobEf = mine.filter((o) => o.metodo === "efectivo").reduce((a, o) => a + o.total, 0);
    const cobTr = mine.filter((o) => o.metodo === "transferencia").reduce((a, o) => a + o.total, 0);
    const rs = state.rendiciones.filter((x) => x.rrpp === id);
    const debeEf = cobEf - rs.reduce((a, x) => a + (x.efectivo || 0), 0), debeTr = cobTr - rs.reduce((a, x) => a + (x.transferencia || 0), 0);
    return { os, entradas, vendido, gen, pag, pend: gen - pag, debeEf, debeTr, aRendir: debeEf + debeTr, pendientes: os.filter((o) => o.estado === "por_aprobar").length };
  }

      && (!q || [o.id, o.comprador, o.email].join(" ").toLowerCase().includes(q))).slice().reverse();
  }

  function openTicket(code) {

    const e = evOf(orderOf(t));
    document.getElementById("modal-root").innerHTML = `<div class="modal-bg" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="tk-t">
      <div style="background:var(--night);color:var(--paper);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center">

      else box.innerHTML = '<div class="empty" style="width:210px">QR no disponible sin conexión</div>';
    } catch (err) { box.innerHTML = '<div class="empty" style="width:210px">No se pudo dibujar el QR</div>'; }
  }
  function openOrder(id) {
    const o = state.orders.find((x) => x.id === id);
    if (!o) return;
    const tks = state.tickets.filter((t) => t.orderId === o.id);
    const steps = [["Pedido creado", true], ["Pago recibido", true], ["Aprobado por Nevada", o.estado === "aprobado"], ["Entradas enviadas por mail", o.estado === "aprobado"]];
    document.getElementById("modal-root").innerHTML = `<div class="modal-bg" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="or-t">

      ${tks.length ? `<div class="inline">${tks.map((t, i) => `<button class="btn btn-deep btn-sm" type="button" data-action="ticket" data-code="${t.code}">Entrada ${i + 1} · ${esc(t.titular)}</button>`).join("")}</div>` : '<span class="hint">Las entradas aparecen acá apenas aprobemos el pedido.</span>'}
      <button class="btn btn-ghost btn-sm" type="button" data-action="closeModal">Cerrar</button></div></div>`;

  function doScan(code) {
    code = String(code || "").trim().toUpperCase();
    if (!code) return;
    const t = state.tickets.find((x) => x.code.toUpperCase() === code);
    let res, detalle;
    if (!t) { res = "invalida"; detalle = "El código no corresponde a ninguna entrada emitida."; }
    else if (t.estado === "anulada") { res = "anulada"; detalle = t.titular + " · dada de baja por el admin"; }
    else if (t.estado === "usada") { res = "usada"; detalle = t.titular + " · ya ingresó " + t.usadaEn; }
    else { t.estado = "usada"; t.usadaEn = nowTxt(); res = "valida"; detalle = t.titular + " · " + t.tipoNombre; }
    state.lastScan = { code, res, detalle };
    state.scans.push({ code, res, at: nowTxt() });
    render();
  }

  // personas de la venta del RRPP: una por entrada, ordenadas según los tipos del evento
  function syncPersonas(d) {
    const order = curEv().types.map((t) => t.id);
    const out = [];
    order.forEach((tp) => {
      const prev = d.personas.filter((p) => p.tipo === tp);
      for (let i = 0; i < (d.qty[tp] || 0); i++) out.push(prev[i] || { tipo: tp, nombre: "", email: "" });
    });
    d.personas = out;
  }

  function resizeImage(file, cb) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast("No se pudo abrir la imagen"); };
    img.src = url;
  }

  /* ───────── Acciones ───────── */
  document.addEventListener("click", (ev) => {
    const go = ev.target.closest("[data-role-go]");
    if (go) { state.role = go.dataset.roleGo; render(); return; }
    const role = ev.target.closest(".role");
    if (role && role.dataset.role) { state.role = role.dataset.role; closeModal(); render(); return; }
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    const err = (id, m) => { const n = document.getElementById(id); n.textContent = m; n.hidden = false; };

    if (a === "login") {
      const u = document.getElementById("lg-user").value.trim().toLowerCase(), pw = document.getElementById("lg-pass").value;
      const acc = state.users.find((x) => x.user === u && x.pass === pw);
      if (!acc) return err("lg-err", "Usuario o contraseña incorrectos.");
      state.session = { user: acc.user, role: acc.role, rrpp: acc.rrpp || null };
      state.role = acc.role === "admin" ? "admin" : "rrpp"; render(); toast("Hola " + acc.user); return;
    }
    if (a === "logout") { state.session = null; state.role = "comprador"; render(); toast("Sesión cerrada"); return; }
    if (a === "loginMode") { state.loginMode = el.dataset.m; render(); return; }
    if (a === "register") {
      const g = (id) => document.getElementById(id).value.trim();
      const nombre = g("rg-nombre"), user = g("rg-user").toLowerCase(), pass = document.getElementById("rg-pass").value, wa = g("rg-wa");
      if (nombre.length < 3) return err("rg-err", "Completá tu nombre y apellido.");
      if (!/^[a-z0-9._-]{3,20}$/.test(user)) return err("rg-err", "El usuario lleva de 3 a 20 letras o números, sin espacios.");
      if (state.users.some((x) => x.user === user) || state.solicitudes.some((x) => x.user === user && x.estado === "pendiente")) return err("rg-err", "Ese usuario ya existe. Elegí otro.");
      if (pass.length < 8) return err("rg-err", "La contraseña necesita al menos 8 caracteres.");
      if (wa.replace(/\D/g, "").length < 8) return err("rg-err", "Revisá el WhatsApp.");
      state.solicitudes.push({ id: uid("s"), nombre, user, pass, whatsapp: wa, estado: "pendiente", fecha: nowTxt() });
      state.loginMode = "login"; render(); toast("Pedido enviado. Te avisamos cuando el admin lo apruebe."); return;
    }
    if (a === "solSi" || a === "solNo") {
      const x = state.solicitudes.find((y) => y.id === el.dataset.id);
      if (!x || x.estado !== "pendiente") return;
      if (a === "solNo") { x.estado = "rechazada"; render(); toast("Pedido rechazado"); return; }
      const id = uid("r");
      state.rrpps.push({ id, nombre: x.nombre, codigo: x.user });
      state.users.push({ user: x.user, pass: x.pass, role: "rrpp", rrpp: id });
      x.estado = "aprobada"; render(); toast(x.nombre + " ya puede ingresar como RRPP"); return;
    }
    if (a === "closeModal") { if (el.classList.contains("modal-bg") && ev.target !== el) return; closeModal(); return; }
    if (a === "reset") {
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "¿Seguro? Tocá de nuevo"; setTimeout(() => { el.dataset.confirm = ""; el.textContent = "Reiniciar demo"; }, 3000); return; }
      el.dataset.confirm = ""; el.textContent = "Reiniciar demo"; state = seed(); closeModal(); render(); toast("Demo reiniciada"); return;
    }
    // comprador
    if (a === "newPurchase") { state.lastOrder = null; render(); return; }
    if (a === "orderLink") { openOrder(el.dataset.id); return; }
    if (a === "qty") {
      const pub = state.events.find((x) => x.publicado); if (!pub) return; ctxEvent = pub.id;
      const t = el.dataset.t, d = state.draft;
      d.qty[t] = Math.max(0, Math.min(10, left(t), (d.qty[t] || 0) + Number(el.dataset.d))); render(); return;
    }
    if (a === "checkout") {
      const pub = state.events.find((x) => x.publicado); ctxEvent = pub.id;
      const d = state.draft;
      if (units(d.qty) === 0) return err("c-err", "Elegí al menos una entrada.");
      if (d.nombre.trim().length < 2 || d.apellido.trim().length < 2) return err("c-err", "Completá nombre y apellido.");
      if (!/^\S+@\S+\.\S+$/.test(d.email.trim())) return err("c-err", "Revisá el correo electrónico.");
      const items = {}; Object.entries(d.qty).forEach(([k, q]) => { if (q > 0) items[k] = q; });
      openMP({ id: "NEV-" + String(state.seq++).padStart(4, "0"), eventId: pub.id, comprador: d.nombre.trim() + " " + d.apellido.trim(), email: d.email.trim(), items, rrpp: d.rrpp, origen: "web", metodo: "mercadopago", estado: "por_aprobar", total: sumTypes(items, "precio"), creado: nowTxt() });
      return;
    }
    if (a === "mpPay" && pendingOrder) {
      state.orders.push(pendingOrder); state.lastOrder = pendingOrder.id;
      state.draft = { qty: {}, nombre: "", apellido: "", email: "", whatsapp: "", rrpp: state.draft.rrpp };
      const id = pendingOrder.id; pendingOrder = null; closeModal(); render(); toast("Pago acreditado · " + id + " espera aprobación"); return;
    }
    if (a === "ticket") { openTicket(el.dataset.code); return; }
    if (a === "goScan") { closeModal(); state.role = "puerta"; render(); const i = document.getElementById("scan-in"); if (i) i.value = el.dataset.code; if (state.role !== "puerta") toast("La Puerta es solo para el admin"); return; }
    if (a === "copy") { const text = el.dataset.text; try { navigator.clipboard.writeText(text).then(() => toast("Copiado"), () => toast(text)); } catch (e) { toast(text); } return; }
    // RRPP
    if (a === "rqty") {
      ctxEvent = state.rrppEvent;
      const d = state.rrppDraft, t = el.dataset.t;
      d.qty[t] = Math.max(0, Math.min(10, left(t), (d.qty[t] || 0) + Number(el.dataset.d)));
      syncPersonas(d); render(); return;
    }
    if (a === "rmetodo") { state.rrppDraft.metodo = el.dataset.m; render(); return; }
    if (a === "rsend") {
      ctxEvent = state.rrppEvent;
      const d = state.rrppDraft;
      const ps = d.personas.map((x) => ({ tipo: x.tipo, nombre: x.nombre.trim(), email: x.email.trim() }));
      if (!ps.length) return err("r-err", "Elegí al menos una entrada.");
      if (ps.some((x) => x.nombre.length < 3)) return err("r-err", "Completá nombre y apellido de cada persona.");
      if (!/^\S+@\S+\.\S+$/.test(ps[0].email)) return err("r-err", "Completá un mail válido para la persona 1.");
      if (ps.some((x) => x.email && !/^\S+@\S+\.\S+$/.test(x.email))) return err("r-err", "Revisá los mails cargados.");
      const items = {}; Object.entries(d.qty).forEach(([k, q]) => { if (q > 0) items[k] = q; });
      const efectivo = d.metodo === "efectivo", id = "NEV-" + String(state.seq++).padStart(4, "0");
      const o = { id, eventId: state.rrppEvent, comprador: ps[0].nombre, email: ps[0].email, personas: ps.map((x) => ({ ...x, email: x.email || ps[0].email })), items, rrpp: state.session.rrpp, origen: "rrpp", metodo: d.metodo, estado: efectivo ? "aprobado" : "por_aprobar", total: sumTypes(items, "precio"), creado: nowTxt() };
      state.orders.push(o);
      if (efectivo) issueTickets(state, o);
      state.rrppDraft = { qty: {}, metodo: d.metodo, personas: [] };
      render(); toast(efectivo ? id + " · " + units(items) + " QR generados · a rendir " + fmt(o.total) : "Venta " + id + " enviada · espera aprobación"); return;
    }
    // admin
    if (a === "atab") { state.adminTab = el.dataset.tab; render(); return; }
    if (a === "editEvent") { state.adminEvent = el.dataset.id; state.adminTab = "evento"; render(); window.scrollTo(0, 0); return; }
    if (a === "dupEvent") {
      const src = evById(el.dataset.id), id = uid("ev");
      state.events.push({ ...JSON.parse(JSON.stringify(src)), id, nombre: src.nombre + " (copia)", publicado: false, ventasAbiertas: false });
      state.adminEvent = id; state.adminTab = "evento"; render(); toast("Evento duplicado: editá fecha y datos"); return;
    }
    if (a === "createEvent") {
      const g = (id) => document.getElementById(id).value.trim();
      if (g("ne-nombre").length < 3) return err("ne-err", "Poné un nombre para el evento.");
      if (!g("ne-fecha")) return err("ne-err", "Completá la fecha y hora.");
      const id = uid("ev");
      state.events.push({ id, nombre: g("ne-nombre"), dj: g("ne-dj"), fecha: g("ne-fecha"), lugar: g("ne-lugar") || "[Lugar a confirmar]", ciudad: "Oncativo, Córdoba", descripcion: "", flyer: null, publicado: false, ventasAbiertas: false, types: defaultTypes() });
      state.adminEvent = id; state.adminTab = "evento"; render(); window.scrollTo(0, 0); toast("Evento creado: configurá sus entradas"); return;
    }
    if (a === "delEvent") {
      ctxEvent = state.adminEvent;
      if (state.orders.some((o) => o.eventId === ctxEvent)) return;
      if (state.events.length === 1) { toast("Tiene que quedar al menos un evento"); return; }
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Tocá de nuevo para eliminar"; return; }
      state.events = state.events.filter((x) => x.id !== ctxEvent); state.adminEvent = state.events[0].id; state.adminTab = "eventos"; render(); toast("Evento eliminado"); return;
    }
    if (a === "tadd") { ctxEvent = state.adminEvent; curEv().types.push({ id: uid("t"), nombre: "Nueva entrada", desc: "", precio: 0, cupo: 100, com: 0, enVenta: false }); render(); toast("Tipo agregado: completalo y pasalo a «Sí»"); return; }
    if (a === "tdel") { ctxEvent = state.adminEvent; if (reserved(el.dataset.t) === 0) { curEv().types = curEv().types.filter((t) => t.id !== el.dataset.t); render(); } return; }
    if (a === "tventa") { ctxEvent = state.adminEvent; const t = typeById(el.dataset.t); t.enVenta = t.enVenta === false; render(); return; }
    if (a === "noFlyer") { ctxEvent = state.adminEvent; curEv().flyer = null; render(); return; }
    if (a === "toggleSales") { ctxEvent = state.adminEvent; curEv().ventasAbiertas = !curEv().ventasAbiertas; render(); return; }
    if (a === "togglePub") {
      ctxEvent = state.adminEvent; const e0 = curEv(), on = !e0.publicado;
      if (on) state.events.forEach((x) => { x.publicado = false; });
      e0.publicado = on; render(); toast(on ? "«" + e0.nombre + "» es ahora el evento de la página de venta" : "Evento sacado de la página"); return;
    }
    if (a === "verVentas") { state.vf = { rrpp: el.dataset.r, estado: "todos", scope: "todos", q: "" }; state.adminTab = "ventas"; render(); return; }
    if (a === "approve") { const o = state.orders.find((x) => x.id === el.dataset.id); if (o && o.estado === "por_aprobar") { o.estado = "aprobado"; issueTickets(state, o); render(); toast(o.id + " aprobado · " + units(o.items) + " QR emitidos"); } return; }
    if (a === "reject") { const o = state.orders.find((x) => x.id === el.dataset.id); if (o && o.estado === "por_aprobar") { o.estado = "rechazado"; render(); toast(o.id + " rechazado"); } return; }
    if (a === "payout") {
      const r = el.dataset.r, v = Math.round(Number(document.getElementById("pay-" + r).value)), pend = rrppStats(r).pend;
      if (!(v > 0)) return toast("Ingresá un monto mayor a cero");
      if (v > pend) return toast("El monto supera lo pendiente (" + fmt(pend) + ")");
      state.payouts.push({ rrpp: r, monto: v, fecha: nowTxt() }); render(); toast("Pago de " + fmt(v) + " registrado"); return;
    }
    if (a === "rendicion") {
      const r = el.dataset.r, st = rrppStats(r);
      const ef = Math.round(Number(document.getElementById("ren-ef-" + r).value) || 0), tr = Math.round(Number(document.getElementById("ren-tr-" + r).value) || 0);
      if (ef < 0 || tr < 0 || ef + tr === 0) return toast("Ingresá cuánto te entregó");
      if (ef > st.debeEf) return toast("El efectivo supera lo que debe (" + fmt(st.debeEf) + ")");
      if (tr > st.debeTr) return toast("Las transferencias superan lo que debe (" + fmt(st.debeTr) + ")");
      state.rendiciones.push({ rrpp: r, efectivo: ef, transferencia: tr, monto: ef + tr, fecha: nowTxt() }); render(); toast("Rendición de " + fmt(ef + tr) + " registrada"); return;
    }
    if (a === "void") { const t = state.tickets.find((x) => x.code === el.dataset.code); if (t && t.estado === "valida") { t.estado = "anulada"; render(); toast("Entrada anulada"); } return; }
    if (a === "scan") { doScan(document.getElementById("scan-in").value); return; }
    if (a === "scanpick") { doScan(el.dataset.code); return; }
  });

  document.addEventListener("input", (ev) => {
    const el = ev.target;
    if (el.dataset.draft) { state.draft[el.dataset.draft] = el.value; if (el.tagName === "SELECT") render(); else save(); return; }
    if (el.dataset.rp !== undefined) { state.rrppDraft.personas[Number(el.dataset.rp)][el.dataset.k] = el.value; save(); return; }
    if (el.dataset.action === "search") { state.vf.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById("a-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  });

  function decodeFile(file) {
    const msg = document.getElementById("cam-msg");
    if (!file) return;
    if (!window.jsQR) { if (msg) msg.textContent = "No se pudo cargar el lector de QR. Revisá la conexión y probá de nuevo."; return; }
    if (msg) msg.textContent = "Leyendo el QR…";
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const hit = window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "attemptBoth" });
      if (hit && hit.data) doScan(hit.data);
      else if (msg) msg.textContent = "No encontramos un QR en la foto. Acercá el celular y que el QR quede derecho y bien iluminado.";
    };
    img.onerror = () => { URL.revokeObjectURL(url); if (msg) msg.textContent = "No se pudo abrir la foto. Probá de nuevo."; };
    img.src = url;
  }

  document.addEventListener("change", (ev) => {
    const el = ev.target, a = el.dataset.action;
    if (a === "camera") { decodeFile(el.files && el.files[0]); el.value = ""; return; }
    if (a === "flyer") { const f = el.files && el.files[0]; if (f) { const evId = state.adminEvent; resizeImage(f, (url) => { evById(evId).flyer = url; render(); toast("Flyer cargado"); }); } el.value = ""; return; }
    if (a === "tset" || a === "tnum") {
      ctxEvent = state.adminEvent; const t = typeById(el.dataset.t); if (!t) return;
      if (a === "tset") t[el.dataset.k] = el.value.trim() || t[el.dataset.k];
      else { let v = Math.max(0, Math.round(Number(el.value) || 0)); if (el.dataset.k === "cupo") v = Math.max(reserved(t.id), v); t[el.dataset.k] = v; }
      render(); return;
    }
    if (a === "ev") { ctxEvent = state.adminEvent; curEv()[el.dataset.k] = el.value; render(); return; }
    if (a === "adminEvent") { state.adminEvent = el.value; if (state.vf.scope === "evento") state.vf.rrpp = state.vf.rrpp; render(); return; }
    if (a === "rrppEvent") { state.rrppEvent = el.value; state.rrppDraft = { qty: {}, metodo: state.rrppDraft.metodo, personas: [] }; render(); return; }
    if (a === "vfRrpp") { state.vf.rrpp = el.value; render(); return; }
    if (a === "vfEstado") { state.vf.estado = el.value; render(); return; }
    if (a === "vfScope") { state.vf.scope = el.value; render(); return; }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && document.getElementById("modal-root").innerHTML) closeModal();
    if (ev.key === "Enter" && ev.target.id === "scan-in") doScan(ev.target.value);
    if (ev.key === "Enter" && (ev.target.id === "lg-user" || ev.target.id === "lg-pass")) document.querySelector('[data-action="login"]')?.click();
  });

  const start = () => render();
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
})();
</script>
